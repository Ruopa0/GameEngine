[package]
name = "cb_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { workspace = true }

bevy_egui = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
avian3d = { workspace = true }
egui_dock = "0.18"
bevy-inspector-egui = "0.36"
cb_input = { version = "0.1.0", path = "../cb_input" }
cb_movement = { path = "../cb_movement" }

bevy-tnua = { workspace = true }

bevy-tnua-avian3d = { workspace = true }
cb_shared = { path = "../cb_shared" }
rhai = { version = "1.26.0", features = ["sync"] }
rfd = "0.17.2"
rand = "0.8"
fastrand = "2.5.0"
bevy_framepace = "0.21"

[features]
weapons = ["cb_weapons"]

[dependencies.cb_weapons]
path = "../cb_weapons"
optional = true

