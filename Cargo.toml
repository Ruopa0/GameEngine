[workspace]
members = [
    "crates/cb_engine",
    "crates/cb_physics",
    "crates/cb_movement",
    "crates/cb_weapons",
    "crates/cb_netcode",
    "crates/cb_renderer",
    "crates/cb_audio",
    "crates/cb_input",
    "crates/cb_world",
    "crates/cb_ai",
    "crates/cb_game",
    "crates/cb_editor",
    "crates/cb_server",
]
resolver = "2"

[workspace.dependencies]

bevy = { version = "0.18", features = ["serialize"] }
avian3d = { version = "0.6.1", features = ["serialize"] }
bevy-tnua = "0.31" 
bevy-tnua-avian3d = "0.11.1" 
lightyear = { version = "0.26.4", features = ["client", "server", "replication", "prediction", "interpolation", "netcode", "udp"] }
bevy_egui = "0.39.1"

cb_engine = { path = "crates/cb_engine" }
cb_physics = { path = "crates/cb_physics" }
cb_movement = { path = "crates/cb_movement" }
cb_weapons = { path = "crates/cb_weapons" }
cb_shared = { path = "crates/cb_shared" }
cb_netcode = { path = "crates/cb_netcode" }
cb_input = { path = "crates/cb_input" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

